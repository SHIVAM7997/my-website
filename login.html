<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login | MediCare+</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }body {
  margin: 0;
  min-height: 100vh;
  background: #f4f8fb;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  width: 90%;
  max-width: 400px;
  background: white;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.12);
  text-align: center;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  color: #1677c8;
  margin-bottom: 10px;
}

h2 {
  margin-bottom: 8px;
  color: #222;
}

.subtitle {
  color: #666;
  font-size: 14px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: #1677c8;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #1677c8;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #105f9f;
}

.demo-info {
  margin-top: 20px;
  padding: 12px;
  background: #eef7ff;
  border-radius: 8px;
  font-size: 13px;
  color: #444;
}

.back {
  display: block;
  margin-top: 20px;
  color: #1677c8;
  text-decoration: none;
}

#message {
  margin-top: 12px;
  font-size: 14px;
  color: red;
}

  </style>
</head><body>  <div class="login-box">
    <div class="logo">✚ MediCare+</div><h2>Patient Login</h2>
<p class="subtitle">Login to access your MediCare+ dashboard</p>

<input type="text" id="username" placeholder="Username or Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="message"></p>

<div class="demo-info">
  <strong>Demo Login</strong><br>
  Username: admin<br>
  Password: 123456
</div>

<a href="index.html" class="back">← Back to Home</a>

  </div>  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (username === "admin" && password === "123456") {
        message.style.color = "green";
        message.innerHTML = "Login successful! Redirecting...";
        
        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 1000);
      } else {
        message.style.color = "red";
        message.innerHTML = "Invalid username or password!";
      }
    }
  </script></body>
</html>
