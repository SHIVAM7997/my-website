<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescriptions | MediCare+</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #333;
    }

    header {
      background: #1677c8;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back {
      background: white;
      color: #1677c8;
      padding: 9px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #1677c8;
    }

    .medicine {
      padding: 15px;
      margin: 12px 0;
      background: #f8fbfe;
      border-radius: 8px;
      border-left: 4px solid #1677c8;
    }

    .medicine strong {
      display: block;
      margin-bottom: 5px;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      text-align: center;
      background: #eef7ff;
      border-radius: 7px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">✚ MediCare+</div>
  <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<div class="container">
  <div class="box">

    <h2>💊 Prescriptions</h2>

    <div class="medicine">
      <strong>Medicine Information</strong>
      No active prescription available.
    </div>

    <div class="medicine">
      <strong>Doctor's Instructions</strong>
      Please consult your healthcare professional before taking any medicine.
    </div>

    <div class="note">
      ℹ️ This prescription section is for demonstration purposes only and does not provide medical advice.
    </div>

  </div>
</div>

</body>
</html>
