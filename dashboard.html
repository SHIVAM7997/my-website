<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Health Report | ZevaCare</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f4f8fb;color:#20394f}
header{background:#fff;padding:15px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e8ee}
.brand{font-size:22px;font-weight:bold}.brand span{color:#1f6fae}
.back{background:#1f6fae;color:#fff;text-decoration:none;padding:10px 15px;border-radius:8px;font-size:13px}
main{max-width:850px;margin:auto;padding:30px 5%}
.hero{text-align:center;margin-bottom:25px}.hero h1{margin-bottom:8px}.hero p{color:#71808d}
.card{background:#fff;border:1px solid #e1e8ee;border-radius:16px;padding:22px;margin-bottom:18px}
.card h2{font-size:19px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px;color:#405466}
input,select,textarea{width:100%;padding:12px;border:1px solid #d7e0e6;border-radius:8px;font-size:14px}
textarea{min-height:85px;resize:vertical}
.full{grid-column:1/-1}
button{background:#1f6fae;color:#fff;border:0;padding:13px 20px;border-radius:8px;font-weight:bold;cursor:pointer}
.result{display:none}
.report{background:#f7fafc;border-radius:12px;padding:18px;line-height:1.7}
.report p{border-bottom:1px solid #e2e8ec;padding:7px 0}
.note{font-size:12px;color:#71808d;line-height:1.6;margin-top:15px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>

<body>

<header>
 <div class="brand">Zeva<span>Care</span></div>
 <a href="dashboard.html" class="back">← Dashboard</a>
</header>

<main>
<section class="hero">
 <h1>📋 My Health Report</h1>
 <p>Create a simple summary of your health information for personal record keeping.</p>
</section>

<div class="card">
 <h2>👤 Personal & Health Information</h2>

 <div class="grid">
  <div><label>Name</label><input id="name" placeholder="Enter name"></div>
  <div><label>Age</label><input id="age" type="number" placeholder="Enter age"></div>

  <div><label>Gender</label>
   <select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
  </div>

  <div><label>Blood Group (Optional)</label>
   <select id="blood"><option value="">Not specified</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
  </div>

  <div class="full"><label>Existing Medical Conditions</label><textarea id="condition" placeholder="Example: diabetes, asthma or none known"></textarea></div>

  <div class="full"><label>Allergies</label><textarea id="allergy" placeholder="Enter known allergies or none known"></textarea></div>

  <div class="full"><label>Current Medicines</label><textarea id="medicine" placeholder="Enter regular medicines if any"></textarea></div>

  <div class="full"><label>Recent Health Notes / Symptoms</label><textarea id="notes" placeholder="Enter any health information you want to record"></textarea></div>
 </div>

 <br>
 <button onclick="createReport()">📄 Generate My Health Summary</button>
</div>

<div class="card result" id="result">
 <h2>📊 Health Summary</h2>
 <div class="report" id="reportContent"></div>
 <p class="note">⚠️ This is a personal health record summary and is not a medical diagnosis or official medical report.</p>
</div>
</main>

<script>
function safe(v){return String(v||"Not specified").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function createReport(){
 const name=document.getElementById("name").value;
 if(!name){alert("Please enter your name.");return;}

 document.getElementById("reportContent").innerHTML=`
 <p><strong>Patient Name:</strong> ${safe(name)}</p>
 <p><strong>Age:</strong> ${safe(document.getElementById("age").value)}</p>
 <p><strong>Gender:</strong> ${safe(document.getElementById("gender").value)}</p>
 <p><strong>Blood Group:</strong> ${safe(document.getElementById("blood").value)}</p>
 <p><strong>Existing Conditions:</strong> ${safe(document.getElementById("condition").value)}</p>
 <p><strong>Allergies:</strong> ${safe(document.getElementById("allergy").value)}</p>
 <p><strong>Current Medicines:</strong> ${safe(document.getElementById("medicine").value)}</p>
 <p><strong>Health Notes:</strong> ${safe(document.getElementById("notes").value)}</p>`;

 document.getElementById("result").style.display="block";
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
