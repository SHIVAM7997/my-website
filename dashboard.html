<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0878f9">

<title>Dashboard | ZevaCare</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f8fd;
    color:#183b5d;
    overflow-x:hidden;
}

a{text-decoration:none;color:inherit}
button{font-family:inherit}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:220px;
    background:white;
    border-right:1px solid #e2ebf4;
    padding:25px 15px;
    z-index:1000;
    overflow-y:auto;
    transition:transform .25s ease;
}

.logo{
    color:#0878f9;
    font-size:25px;
    font-weight:800;
    padding:0 12px;
    margin-bottom:30px;
}

.logo span{color:#075bc4}

.nav-title{
    color:#9aaabd;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    padding:0 12px;
    margin:20px 0 8px;
}

.nav-link{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:11px 12px;
    margin:3px 0;
    border-radius:10px;
    color:#60758a;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.nav-link:hover,
.nav-link.active{
    background:#eaf4ff;
    color:#0878f9;
}

.nav-icon{
    width:23px;
    text-align:center;
    font-size:17px;
}

.logout{margin-top:20px;color:#e25555}
.logout:hover{background:#fff2f2;color:#d53c3c}

/* ================= MOBILE ================= */

.mobile-menu{
    display:none;
    position:fixed;
    top:14px;
    left:14px;
    width:42px;
    height:42px;
    border:0;
    border-radius:11px;
    background:#0878f9;
    color:white;
    font-size:21px;
    z-index:1200;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(8,120,249,.25);
}

.drawer-shade{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,35,60,.35);
    z-index:900;
}

.drawer-close{
    display:none;
}

/* ================= MAIN ================= */

main{
    margin-left:220px;
    width:calc(100% - 220px);
    padding:28px 30px 45px;
}

/* ================= TOP ================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.greeting h1{
    font-size:27px;
    color:#143c61;
    margin-bottom:5px;
}

.greeting p{
    color:#8293a6;
    font-size:13px;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.profile-info{
    text-align:right;
}

.profile-info strong{
    display:block;
    color:#214766;
    font-size:13px;
}

.profile-info span{
    color:#91a0b0;
    font-size:11px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#e6f2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0878f9;
    font-weight:800;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* EDIT BUTTON */

.edit-btn{
    border:1px solid #cfe0f2;
    background:white;
    color:#1267d6;
    border-radius:9px;
    padding:8px 11px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

.edit-btn:hover{
    background:#eef7ff;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:18px;
}

.stat-card{
    background:white;
    border:1px solid #e4edf6;
    border-radius:16px;
    padding:18px;
    min-height:125px;
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.stat-label{
    color:#8292a4;
    font-size:12px;
    font-weight:600;
}

.stat-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    background:#eaf4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.stat-value{
    color:#163c5e;
    font-size:25px;
    font-weight:800;
}

.stat-unit{
    color:#8a99aa;
    font-size:11px;
}

.stat-note{
    color:#8b9bad;
    font-size:11px;
    margin-top:5px;
}

/* ================= GRID ================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.45fr .8fr;
    gap:18px;
}

.card{
    background:white;
    border:1px solid #e2ebf4;
    border-radius:17px;
    padding:20px;
    box-shadow:0 5px 20px rgba(34,76,112,.03);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.card-header h2{
    font-size:17px;
    color:#173d5f;
}

.card-header span{
    color:#8c9bab;
    font-size:11px;
}

.live{
    display:flex;
    align-items:center;
    gap:7px;
    color:#26a269;
    font-size:11px;
    font-weight:700;
}

.live-dot{
    width:8px;
    height:8px;
    background:#26a269;
    border-radius:50%;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.3}
}

/* ================= ECG ================= */

.monitor{
    min-height:270px;
}

.monitor-value{
    display:flex;
    align-items:end;
    gap:8px;
    margin-bottom:14px;
}

.heart-number{
    font-size:43px;
    font-weight:800;
    color:#153f63;
}

.bpm{
    color:#8b9bab;
    font-size:12px;
    margin-bottom:8px;
}

.ecg-box{
    height:135px;
    overflow:hidden;
    border-radius:12px;
    background:#f7fbff;
    border:1px solid #e6eff8;
    position:relative;
}

.ecg-line{
    position:absolute;
    left:0;
    top:50%;
    width:200%;
    height:100%;
    transform:translateY(-50%);
    animation:ecgMove 4s linear infinite;
}

@keyframes ecgMove{
    from{transform:translate(-25%,-50%)}
    to{transform:translate(0%,-50%)}
}

.ecg-line svg{
    width:50%;
    height:100%;
}

.monitor-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:13px;
    color:#8998a8;
    font-size:11px;
}

.heart-animation{
    animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
    0%,100%{transform:scale(1)}
    15%{transform:scale(1.12)}
    30%{transform:scale(1)}
}

/* ================= AWARENESS ================= */

.awareness{
    background:linear-gradient(135deg,#0878f9,#4ba1ff);
    color:white;
    min-height:270px;
}

.awareness .card-header h2{color:white}
.awareness .card-header span{color:rgba(255,255,255,.75)}

.awareness-content{padding-top:10px}

.awareness-icon{
    font-size:35px;
    margin-bottom:14px;
}

.awareness-content h3{
    font-size:20px;
    margin-bottom:10px;
}

.awareness-content p{
    color:rgba(255,255,255,.9);
    font-size:13px;
    line-height:1.7;
}

.awareness-dots{
    display:flex;
    gap:5px;
    margin-top:25px;
}

.awareness-dot{
    width:20px;
    height:4px;
    border-radius:5px;
    background:rgba(255,255,255,.35);
}

.awareness-dot.active{background:white}

/* ================= QUICK ================= */

.section-title{
    margin:25px 0 13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.section-title h2{
    color:#173d5f;
    font-size:18px;
}

.section-title span{
    color:#8b9aaa;
    font-size:11px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}

.quick-card{
    background:white;
    border:1px solid #e3ecf5;
    border-radius:14px;
    padding:17px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.quick-card:hover{
    transform:translateY(-3px);
    border-color:#b9d9fa;
    box-shadow:0 10px 25px rgba(30,91,140,.08);
}

.quick-icon{
    width:40px;
    height:40px;
    margin:0 auto 9px;
    border-radius:11px;
    background:#eaf4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.quick-card strong{
    display:block;
    color:#31526e;
    font-size:11px;
}

/* ================= LOWER ================= */

.lower-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-top:18px;
}

.list{
    display:grid;
    gap:11px;
}

.list-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px;
    border-radius:11px;
    background:#f8fbfe;
}

.item-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.item-icon{
    width:35px;
    height:35px;
    border-radius:9px;
    background:#eaf4ff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.item-name{
    color:#355570;
    font-size:12px;
    font-weight:700;
}

.item-sub{
    color:#93a1b0;
    font-size:10px;
    margin-top:3px;
}

.status{
    font-size:10px;
    padding:5px 8px;
    border-radius:20px;
    background:#eaf8f1;
    color:#25945e;
}

.status.pending{
    background:#fff7df;
    color:#a67a00;
}

.status.missed{
    background:#fff0f0;
    color:#d95353;
}

/* ================= TREND ================= */

.trend{
    height:175px;
    display:flex;
    align-items:end;
    justify-content:space-around;
    gap:8px;
    padding:20px 8px 25px;
    position:relative;
}

.trend-empty{
    position:absolute;
    inset:30px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#8a9aaa;
    font-size:12px;
    line-height:1.5;
}

.bar{
    width:9%;
    max-width:28px;
    min-height:3px;
    border-radius:7px 7px 2px 2px;
    background:#b8d9fa;
}

.day{
    color:#96a4b2;
    font-size:9px;
}

/* ================= FUTURE ================= */

.future{
    margin-top:18px;
    background:linear-gradient(135deg,#102f4d,#1b547e);
    color:white;
    border-radius:18px;
    padding:25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.future h2{
    font-size:20px;
    margin-bottom:8px;
}

.future p{
    color:#c5d7e6;
    font-size:12px;
    line-height:1.6;
    max-width:650px;
}

.future-btn{
    border:0;
    background:white;
    color:#1263ae;
    padding:11px 17px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

/* ================= MODALS ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,35,60,.48);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{display:flex}

.modal-box{
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-head h2{
    color:#173d5f;
    font-size:20px;
}

.close{
    border:0;
    background:#f0f5fa;
    width:34px;
    height:34px;
    border-radius:9px;
    cursor:pointer;
    font-size:18px;
}

.support-list{
    display:grid;
    gap:10px;
}

.support-btn{
    width:100%;
    border:1px solid #e2ebf4;
    background:#f8fbfe;
    padding:13px;
    border-radius:11px;
    text-align:left;
    cursor:pointer;
    color:#31536f;
    font-weight:700;
}

.support-btn:hover{
    border-color:#bcdcff;
    background:#eef7ff;
}

/* ================= EDIT MODAL ================= */

.edit-modal .modal-box{
    max-width:760px;
}

.edit-grid{
