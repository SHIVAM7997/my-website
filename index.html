<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f6fae">

  <title>ZevaCare | Health Information & Guidance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f7fafc;
      color: #1e293b;
    }

    /* Header */
    header {
      background: #ffffff;
      padding: 15px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8eef3;
    }

    /* Logo */
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-mark {
      width: 43px;
      height: 43px;
      border-radius: 11px;
      background: #1769aa;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 27px;
      font-weight: bold;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 700;
      color: #163a59;
    }

    .brand-name span {
      color: #1769aa;
    }

    .tagline {
      font-size: 11px;
      color: #7a8794;
      margin-top: 2px;
    }

    .login-btn {
      background: #1769aa;
      color: white;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 600;
    }

    /* ===============================
       HEALTH AWARENESS AUTO SLIDER
    =============================== */

    .banner-slider {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .slide {
      display: none;
      min-height: 560px;
      padding: 70px 10%;
      align-items: center;
      justify-content: space-between;
      gap: 60px;
      animation: fadeSlide 0.6s ease;
    }

    .
